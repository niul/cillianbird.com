# JSP View Configuration (Views are in src/main/webapp/WEB-INF/views/)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- Tiles Configuration ---
# 1. Register the Tiles configuration files
spring.tiles.definitions=/WEB-INF/tiles.xml
# 2. Enable Tiles support
spring.tiles.check-refresh=true